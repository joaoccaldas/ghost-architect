<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo Nexus | Inteligência Artificial Corporativa</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nexus: {
                            black: '#030303',
                            dark: '#0a0a0a',
                            panel: '#111111',
                            green: '#00ff41',
                            greenDim: 'rgba(0, 255, 65, 0.1)',
                            cyan: '#00f3ff',
                            purple: '#bd00ff',
                            text: '#e0e0e0',
                            muted: '#666666'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'glitch': 'glitch 1s linear infinite',
                        'scanline': 'scanline 8s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' },
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030303;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ff41;
        }

        /* CRT/Matrix Overlay Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            position: fixed;
            pointer-events: none;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 50;
        }

        .matrix-bg {
            background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 65, 0.03) 0%, transparent 50%),
                              linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(10,10,10,0) 100%);
        }
        
        .neon-border {
            box-shadow: 0 0 5px rgba(0, 255, 65, 0.2), inset 0 0 5px rgba(0, 255, 65, 0.1);
        }
        
        .neon-text-glow {
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .cyber-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconCpu = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
        );

        const IconNetwork = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="5" r="3"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="12" x2="7.5" y2="16"></line><line x1="12" y1="12" x2="16.5" y2="16"></line><circle cx="7.5" cy="19" r="2.5"></circle><circle cx="16.5" cy="19" r="2.5"></circle></svg>
        );

        const IconShield = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        );

        const TerminalLine = ({ text, delay = 0 }) => {
            const [displayText, setDisplayText] = useState('');
            
            useEffect(() => {
                let currentText = '';
                let currentIndex = 0;
                
                const timeout = setTimeout(() => {
                    const interval = setInterval(() => {
                        if (currentIndex < text.length) {
                            currentText += text[currentIndex];
                            setDisplayText(currentText);
                            currentIndex++;
                        } else {
                            clearInterval(interval);
                        }
                    }, 30); // Typing speed
                    
                    return () => clearInterval(interval);
                }, delay);
                
                return () => clearTimeout(timeout);
            }, [text, delay]);

            return (
                <div className="font-mono text-xs md:text-sm text-nexus-green opacity-80 mb-1">
                    <span className="text-nexus-muted mr-2">root@nexus:~$</span>
                    {displayText}
                    <span className="animate-pulse">_</span>
                </div>
            );
        };

        const ServiceCard = ({ icon, title, description, borderClass }) => (
            <div className={`bg-nexus-panel border border-nexus-muted/20 p-6 md:p-8 hover:border-nexus-green transition-all duration-300 group relative overflow-hidden`}>
                <div className={`absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-nexus-green to-transparent transform -translate-x-full group-hover:translate-x-full transition-transform duration-1000`}></div>
                
                <div className="mb-4 text-nexus-green opacity-80 group-hover:opacity-100 transition-opacity">
                    {icon}
                </div>
                <h3 className="text-xl font-bold font-sans text-white mb-2 group-hover:text-nexus-green transition-colors">{title}</h3>
                <p className="text-nexus-muted text-sm leading-relaxed group-hover:text-gray-400 transition-colors">
                    {description}
                </p>
                
                <div className="absolute bottom-4 right-4 text-[10px] font-mono text-nexus-muted opacity-0 group-hover:opacity-100 transition-opacity">
                    SYSTEM.ACTIVE
                </div>
            </div>
        );

        const App = () => {
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="min-h-screen relative font-sans text-gray-300 selection:bg-nexus-green selection:text-black">
                    <div className="scanlines"></div>
                    
                    {/* Background Elements */}
                    <div className="fixed inset-0 cyber-grid z-[-1] opacity-40"></div>
                    <div className="fixed inset-0 matrix-bg z-[-2]"></div>

                    {/* Navigation */}
                    <nav className={`fixed w-full z-40 transition-all duration-300 border-b ${scrolled ? 'bg-nexus-black/90 backdrop-blur-md border-nexus-green/30 py-4' : 'bg-transparent border-transparent py-6'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="w-3 h-3 bg-nexus-green rounded-full animate-pulse"></div>
                                <span className="font-mono font-bold tracking-widest text-lg text-white">
                                    PROTOCOLO <span className="text-nexus-green">NEXUS</span>
                                </span>
                            </div>
                            
                            <div className="hidden md:flex gap-8 font-mono text-xs tracking-widest">
                                {['INICIALIZAR', 'SISTEMAS', 'ARQUITETURA', 'CONTATO'].map((item) => (
                                    <a href="#" key={item} className="text-nexus-muted hover:text-nexus-green transition-colors relative group">
                                        {item}
                                        <span className="absolute -bottom-1 left-0 w-0 h-[1px] bg-nexus-green group-hover:w-full transition-all duration-300"></span>
                                    </a>
                                ))}
                            </div>

                            <button className="md:hidden text-nexus-green">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16m-7 6h7" />
                                </svg>
                            </button>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="min-h-screen flex items-center justify-center pt-20 relative px-6">
                        <div className="max-w-5xl w-full mx-auto grid md:grid-cols-2 gap-12 items-center">
                            <div className="space-y-8">
                                <div className="space-y-2">
                                    <TerminalLine text="iniciando protocolo de conexão segura..." delay={500} />
                                    <TerminalLine text="carregando módulos de inteligência..." delay={1500} />
                                    <TerminalLine text="acesso concedido. bem-vindo, executivo." delay={2500} />
                                </div>
                                
                                <h1 className="text-5xl md:text-7xl font-extrabold text-white leading-tight tracking-tight">
                                    A NOVA ORDEM <br/>
                                    DA <span className="text-nexus-green neon-text-glow">INTELIGÊNCIA</span>
                                </h1>
                                
                                <p className="text-nexus-muted text-lg max-w-md border-l-2 border-nexus-green pl-6 py-2">
                                    Arquitetura de sistemas autônomos e estratégia digital de alta frequência para corporações que não aceitam latência.
                                </p>
                                
                                <div className="flex gap-4 pt-4">
                                    <button className="bg-nexus-green text-black font-mono font-bold py-3 px-8 hover:bg-white transition-colors duration-300 clip-path-slant">
                                        INICIAR_PROJETO
                                    </button>
                                    <button className="border border-nexus-muted text-white font-mono py-3 px-8 hover:border-nexus-green hover:text-nexus-green transition-colors duration-300">
                                        VER_DADOS
                                    </button>
                                </div>
                            </div>
                            
                            {/* Abstract Visual / Right Side */}
                            <div className="relative hidden md:block h-96">
                                <div className="absolute inset-0 border border-nexus-green/20 rounded-lg p-2">
                                    <div className="w-full h-full bg-nexus-panel/50 backdrop-blur-sm rounded overflow-hidden relative">
                                        <div className="absolute top-0 left-0 w-full h-8 bg-nexus-black border-b border-nexus-muted/20 flex items-center px-4 gap-2">
                                            <div className="w-2 h-2 rounded-full bg-red-500"></div>
                                            <div className="w-2 h-2 rounded-full bg-yellow-500"></div>
                                            <div className="w-2 h-2 rounded-full bg-green-500"></div>
                                        </div>
                                        <div className="p-6 pt-12 font-mono text-xs text-nexus-green space-y-2 opacity-80">
                                            <div className="flex justify-between"><span>CPU_USAGE</span><span>12%</span></div>
                                            <div className="w-full bg-nexus-dark h-1"><div className="w-[12%] bg-nexus-green h-full"></div></div>
                                            
                                            <div className="flex justify-between pt-2"><span>MEMORY_ALLOC</span><span>4.2GB</span></div>
                                            <div className="w-full bg-nexus-dark h-1"><div className="w-[60%] bg-nexus-green h-full"></div></div>

                                            <div className="pt-8 text-nexus-muted">
                                                > analisando mercado...<br/>
                                                > detectando oportunidades de automação...<br/>
                                                > otimizando fluxo de receita...<br/>
                                                <span className="text-white">> PROTOCOLO NEXUS ATIVO</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="absolute -z-10 -top-4 -right-4 w-full h-full border border-nexus-muted/20"></div>
                            </div>
                        </div>
                    </section>

                    {/* Services Grid */}
                    <section className="py-24 bg-nexus-black relative border-t border-nexus-muted/10">
                        <div className="max-w-7xl mx-auto px-6">
                            <div className="mb-16">
                                <h2 className="text-3xl font-bold text-white mb-4">MÓDULOS DE OPERAÇÃO</h2>
                                <div className="w-24 h-1 bg-nexus-green"></div>
                            </div>
                            
                            <div className="grid md:grid-cols-3 gap-6">
                                <ServiceCard 
                                    icon={<IconCpu />}
                                    title="Automação Neural"
                                    description="Implementação de agentes autônomos que operam 24/7, eliminando gargalos operacionais e reduzindo custos fixos."
                                />
                                <ServiceCard 
                                    icon={<IconNetwork />}
                                    title="Estratégia Cibernética"
                                    description="Análise de dados preditiva e reestruturação de processos digitais para maximizar a eficiência do capital."
                                />
                                <ServiceCard 
                                    icon={<IconShield />}
                                    title="Segurança Cognitiva"
                                    description="Proteção de integridade de dados e arquitetura de sistemas resilientes contra falhas e intrusões."
                                />
                            </div>
                        </div>
                    </section>

                    {/* Footer / Terminal */}
                    <footer className="bg-nexus-dark py-12 border-t border-nexus-green/20">
                        <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="text-left">
                                <h3 className="text-xl font-bold text-white tracking-widest">PROTOCOLO NEXUS</h3>
                                <p className="text-nexus-muted text-sm font-mono mt-1">São Paulo // Global Grid</p>
                            </div>
                            
                            <div className="font-mono text-xs text-nexus-green text-center md:text-right">
                                <p>SYSTEM STATUS: STABLE</p>
                                <p>ENCRYPTION: 256-BIT</p>
                                <p className="mt-2 text-nexus-muted">© 2024 Protocolo Nexus. Todos os direitos reservados.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
